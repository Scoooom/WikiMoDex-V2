# WikiMoDex — cache-control-override.conf
# Location: /etc/nginx/snippets/cache-control-override.conf
#
# No longer needed — cache headers are now set via a map block in the
# main vhost config. See docs/nginx-void.scooom.xyz.conf.
#
# The map block matches $uri patterns to Cache-Control directives,
# and the PHP location block applies it with:
#   fastcgi_hide_header Cache-Control;
#   add_header Cache-Control $cache_control always;
