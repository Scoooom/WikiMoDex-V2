# WikiMoDex — Cache-Control override
# Place this inside your server {} block in /etc/nginx/sites-available/void.scooom.xyz
#
# Laravel's StartSession middleware stamps "Cache-Control: no-cache, private"
# on every response that touches the session. We can't reliably stop it from
# PHP, so Nginx overrides it here using the X-Accel-Cache-Control header
# that our SetCacheHeaders middleware sets.
#
# If X-Accel-Cache-Control is present, use it as Cache-Control and hide it
# from the upstream response. If absent, pass through whatever Laravel sent.

map $upstream_http_x_accel_cache_control $cache_control_final {
    default                         $upstream_http_cache_control;
    "~."                            $upstream_http_x_accel_cache_control;
}

# Then inside location @laravel (or your PHP-FPM location block), add:
#
#   add_header Cache-Control $cache_control_final always;
#   proxy_hide_header X-Accel-Cache-Control;
#   fastcgi_hide_header X-Accel-Cache-Control;
#
# Note: "always" means the header is added even on error responses.
# Remove the existing "add_header Cache-Control" line if present.
