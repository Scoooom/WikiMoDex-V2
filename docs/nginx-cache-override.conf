# WikiMoDex — Cache-Control override snippet
# Location: /etc/nginx/snippets/cache-control-override.conf
#
# Include this inside any PHP-FPM location block where you want Nginx
# to honour the Cache-Control value set by Laravel's SetCacheHeaders
# middleware, rather than Laravel's default "no-cache, private".
#
# Laravel's StartSession stamps "no-cache, private" on every response.
# SetCacheHeaders works around this by setting X-Accel-Cache-Control
# with the intended directive instead. Nginx reads it here, uses it as
# the outgoing Cache-Control header, and strips the internal header.

fastcgi_hide_header Cache-Control;
fastcgi_hide_header X-Accel-Cache-Control;
add_header Cache-Control $upstream_http_x_accel_cache_control always;
