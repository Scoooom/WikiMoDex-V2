server {
    listen 80;
    listen [::]:80;
    server_name void.scooom.xyz;
    return 301 https://$host$request_uri;
}

# Cache-Control map — matches URI to the correct Cache-Control directive.
# Nginx evaluates these top to bottom, first match wins.
map $request_uri $cache_control {
    # Never cache — admin, auth, user-specific, write endpoints
    ~^/admin/                                       "no-store";
    ~^/auth/                                        "no-store";
    ~^/login                                        "no-store";
    ~^/logout                                       "no-store";
    ~^/upload                                       "no-store";
    ~^/create                                       "no-store";
    ~^/like:                                        "no-store";
    ~^/rLike:                                       "no-store";
    ~^/dislike:                                     "no-store";
    ~^/rDislike:                                    "no-store";
    ~^/uLike:                                       "no-store";
    ~^/uRLike:                                      "no-store";
    ~^/u:                                           "no-store";
    ~^/d:                                           "no-store";
    ~^/g:                                           "no-store";
    ~^/me\.json$                                    "no-store";
    ~^/wiki-search\.json$                           "no-store";
    ~^/discord/                                     "no-store";

    # Homepage — short CDN TTL, stats change frequently
    ~^/$                                            "public, max-age=0, s-maxage=300, stale-while-revalidate=30";

    # Sprites — long CDN TTL, purge manually if sprites change
    ~^/front:                                       "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/back:                                        "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/cFront:                                      "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/cBack:                                       "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/alt-build-sprite:                            "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";

    # JSON data endpoints
    ~^/alt-build-stats/                             "public, max-age=0, s-maxage=3600, stale-while-revalidate=30";
    ~^/pokevoid-atlas/                              "public, max-age=0, s-maxage=86400, stale-while-revalidate=30";

    # Wiki, gallery, static pages — long CDN TTL, purge on content change
    ~^/wiki                                         "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/gallery                                      "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/core:                                        "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/smitty                                       "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/faq                                          "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/gacha                                        "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
    ~^/trainercard:                                 "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";

    # Default — no-store for anything not explicitly listed
    default                                         "no-store";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name void.scooom.xyz;
    root /var/www/void.scooom.com/public;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/void.scooom.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/void.scooom.xyz/privkey.pem;

    index index.php;

    location /pokevoid-sprites/ {
        alias /var/www/void.scooom.com/pokevoid/public/images/pokemon/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=0, s-maxage=31536000, stale-while-revalidate=30";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-void.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Strip whatever Cache-Control Laravel sends, apply our map value instead
        fastcgi_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;
    }

    location /gacha/ {
        index index.html;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/void_error.log;
    access_log /var/log/nginx/void_access.log;
}
